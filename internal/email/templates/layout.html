<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:6px;border-top:4px solid {{.Accent}};">
<tr><td style="padding:24px 24px 8px 24px;">
<h1 style="margin:0;font-size:20px;line-height:1.3;font-weight:600;color:#18181b;">{{.Title}}</h1>
</td></tr>
{{range .Paragraphs}}<tr><td style="padding:8px 24px;font-size:15px;line-height:1.5;color:#27272a;">{{.}}</td></tr>
{{end}}{{if .Link}}<tr><td style="padding:16px 24px 8px 24px;">
<a href="{{.Link}}" style="display:inline-block;padding:10px 16px;background:#18181b;color:#ffffff;text-decoration:none;border-radius:4px;font-size:15px;">{{.LinkLabel}}</a>
</td></tr>
{{end}}<tr><td style="padding:16px 24px 24px 24px;font-size:12px;line-height:1.5;color:#71717a;">{{.Footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
