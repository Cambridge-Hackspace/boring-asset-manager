# BAM! configuration for a systemd install (docs/installing.md). Install as
# /etc/bam/config.toml, owned by root, group bam, mode 0640: a database
# password in the DSN must not be readable by other users.

[server]
# Behind a reverse proxy that terminates HTTPS (recommended), listen on
# loopback only. To serve plain HTTP on the network instead, use "0.0.0.0"
# and an http:// base_url.
host = "127.0.0.1"
port = 8080
# The address people use to reach BAM. An https:// address marks session
# cookies Secure; links in notifications point here.
base_url = "https://bam.example.org"

[database]
# "sqlite", "postgres" or "mariadb" (docs/data-model.md for PostgreSQL and MariaDB).
type = "sqlite"
dsn = "/var/lib/bam/bam.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
# type = "postgres"
# dsn = "postgres://bam:secret@localhost:5432/bam?sslmode=disable"
# type = "mariadb"
# dsn = "bam:secret@tcp(localhost:3306)/bam"

[storage]
# Uploaded photos and label images: "local", the directory below, or
# "s3", a bucket of an S3-compatible store, set in [storage.s3] (docs/configuration.md).
backend = "local"
local_path = "/var/lib/bam/uploads"

[printers]
# Device files printers may be connected to directly (docs/printing.md), as
# path.Match patterns, such as "/dev/usb/lp*". Empty turns device
# connections off. The service needs SupplementaryGroups=lp to use them.
devices = []
