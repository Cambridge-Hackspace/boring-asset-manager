# boring-asset-manager as a reaper tenant.
#
# Follows the tenant contract in docs/tenants.md and testing methodology
# in docs/testing-methodology.md:
# - Disposable remote VM execution on Proxmox VE (ubuntu-26.04)
# - Toolchain arrives as a digest-pinned container image
# - Build caches (GOCACHE, GOMODCACHE) mapped to tank/cache so resets stay fast
# - Ephemeral test state (SQLite database, file uploads) mapped to $REAPER_STATE
#   so in-guest ZFS rollback returns state to pristine between runs in seconds.

schema = 1
project = "boring-asset-manager"

guests = ["ubuntu-26.04"]
exec = "container"

[build]
# golang:1.23-bookworm (digest-pinned; tags are forbidden by reaper schema)
image = "docker.io/library/golang@sha256:167053a2bb901972bf2c1611f8f52c44d5fe7e762e5cab213708d82c421614db"
cmd = """
GOCACHE=$REAPER_CACHE_GOCACHE \
GOPATH=$REAPER_CACHE_GOPATH \
go build -v -o /dev/null ./cmd/bam"""
# Caches are declared here and mounted for every verb. npm and node-modules
# hold the web interface's packages, off the guest's small root disk.
cache = ["gocache", "gopath", "npm", "node-modules"]

[run]
# The Go suites (with -race, the test database and uploads in $REAPER_STATE),
# then svelte-check, Vitest and Playwright. Each runs in its own pinned
# container, which a containerized verb cannot start, so this verb runs on the
# guest and tools/reaper/run.sh starts them with its podman.
exec = "host"
cmd = "tools/reaper/run.sh"
# Every image tools/reaper/run.sh and the scripts it calls use, pulled first.
images = [
  "docker.io/library/golang@sha256:167053a2bb901972bf2c1611f8f52c44d5fe7e762e5cab213708d82c421614db",
  "docker.io/library/node@sha256:2c752226d477b4a886378baa95b9af252be59301b725fdb0b7e15208131505a8",
  "mcr.microsoft.com/playwright@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462",
]

[sync]
exclude = [
  "/bin/",
  "/data/",
  "/out/",
  "/web/node_modules/",
  "/web/.e2e/",
  "/web/test-results/",
  "/web/playwright-report/",
  "/internal/webui/static/app/",
]

[reset]
# tank/state is the only dataset reset/snapshot touches.
# Rollback resets SQLite databases and uploads between test passes.
datasets = ["state"]

[resources]
cores = 4
ram_gb = 8

[profiles.dev]
ttl = "2h"
warm_cache = true

[profiles.nightly]
ttl = "12h"
# Cold cache to guarantee repeatable builds from scratch
warm_cache = false
